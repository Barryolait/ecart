name: Mise à jour des données

on:
  schedule:
    - cron: "*/15 * * * *"   # GDELT publie toutes les 15 min
  workflow_dispatch:
  push:
    paths: ["data/participation.csv", "data/concours.csv"]

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Participation (CSV -> JSON)
        run: python scripts/build_participation.py
      - name: Concours enseignants (CSV -> JSON)
        run: python scripts/build_concours.py
      - name: Événements GDELT
        run: python scripts/fetch_events.py || echo "GDELT indisponible, on garde l'ancien fichier"
      # Mensuel : une requête par heure suffit, le fichier n'est réécrit que si l'INSEE publie
      - name: Inflation INSEE
        run: |
          if [ "$(date +%M)" -lt 15 ] || [ "${{ github.event_name }}" != "schedule" ] || [ ! -f data/series/ipc.json ]; then
            python scripts/fetch_ipc.py || echo "API INSEE indisponible, on garde l'ancien fichier"
          fi
      # Archive quotidienne (~30 Mo, mise à jour le soir) : un calcul par jour suffit
      - name: Historique gazole
        run: |
          if [ "$(python -c 'import json;print(json.load(open("data/series/gazole.json"))["updated"][:10])' 2>/dev/null)" != "$(date -u +%F)" ]; then
            python scripts/fetch_carburants_historique.py || echo "Archive carburants indisponible, on garde l'ancien historique"
          fi
      # Données annuelles (~30 Mo à télécharger) : une vérification par semaine, date notée dans data/verifications.json
      - name: École (IPS, effectifs)
        run: |
          last=$(python -c 'import json;print(json.load(open("data/verifications.json")).get("ecole",""))' 2>/dev/null)
          if [ "$last" \< "$(date -u -d '7 days ago' +%F)" ]; then
            python scripts/fetch_ecole.py && python -c 'import json,datetime,pathlib;p=pathlib.Path("data/verifications.json");d=json.loads(p.read_text()) if p.exists() else {};d["ecole"]=datetime.date.today().isoformat();p.write_text(json.dumps(d))' \
              || echo "data.education.gouv.fr indisponible, on garde les anciens fichiers"
          fi
      # Une requête par run : le cron GitHub est trop irrégulier pour viser « une fois par heure »
      - name: Prix carburants
        run: python scripts/fetch_carburants.py || echo "API carburants indisponible, on garde l'ancien fichier"
      - name: Commit
        run: |
          git config user.name "ecart-bot"
          git config user.email "ecart-bot@users.noreply.github.com"
          git add data/*.json data/series/*.json
          git diff --cached --quiet && exit 0
          git commit -m "data: mise à jour $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main   # au cas où le CSV a été modifié pendant le run
          git push
